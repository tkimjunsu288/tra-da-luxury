<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ông Tuân | Trà Đá Luxury</title><style>*{box-sizing:border-box}body{margin:0;background:#f8efe2;color:#503b2d;font:16px system-ui,-apple-system,sans-serif}.app{max-width:800px;margin:auto;padding:18px}h1{margin:0 0 5px}.sub{color:#826e5b}.panel{background:#fffaf1;border:2px solid #d4b99d;border-radius:20px;padding:16px}.stage{height:390px;border-radius:16px;background:linear-gradient(#a4d1c9 0 63%,#e5c99b 63%);position:relative;display:grid;place-items:center;overflow:hidden}.stage:before{content:'TRÀ ĐÁ LUXURY';position:absolute;top:18px;padding:8px 20px;background:#9b5940;border:4px solid #ffe4b0;border-radius:12px;color:white;font-weight:900;letter-spacing:2px}.stage:after{content:'';position:absolute;bottom:26px;width:100%;border-bottom:4px dashed #c2a17d}svg{width:220px;height:310px;filter:drop-shadow(0 8px 3px #4329)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button{font-weight:750;border:2px solid #c3a58b;border-radius:12px;background:#f8e9cf;padding:13px 5px;color:#533c2f;touch-action:manipulation}button.active{color:white;background:#537c61;border-color:#537c61}.status{background:#e3e9d9;padding:12px;border-radius:12px;margin:12px 0;font-weight:700}.bubble{position:absolute;top:95px;right:6%;background:white;border:2px solid #765541;border-radius:13px;padding:9px;max-width:135px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.note{font-size:13px;line-height:1.6;color:#866f59}@media(max-width:480px){.stage{height:350px}svg{width:200px;height:275px}.bubble{right:2%;max-width:95px;font-size:12px}}</style></head><body><div class="app"><h1>Ông Tuân · Animation Lab</h1><p class="sub">Bản demo độc lập chạy trực tiếp bằng Safari</p><section class="panel"><div class="stage"><div class="bubble" id="say">Chào bác!</div><svg viewBox="0 0 220 320" aria-label="Nhân vật Ông Tuân hoạt hình"><ellipse cx="110" cy="300" rx="51" ry="10" opacity=".15"/><g id="body"><g id="legL" transform="translate(90 218)"><path d="M0 0 L-4 65" stroke="#53494a" stroke-width="24" stroke-linecap="round"/><ellipse cx="-8" cy="68" rx="23" ry="10" fill="#352f30"/></g><g id="legR" transform="translate(127 218)"><path d="M0 0 L6 65" stroke="#53494a" stroke-width="24" stroke-linecap="round"/><ellipse cx="12" cy="68" rx="23" ry="10" fill="#352f30"/></g><path d="M80 145 Q108 127 143 147L151 226Q112 239 73 225Z" fill="#8fa482" stroke="#4e4b3e" stroke-width="3"/><path d="M107 148v80" stroke="#6e8d77" stroke-width="3"/><g id="armL" transform="translate(83 158)"><path d="M0 0 Q-24 24 -15 70" fill="none" stroke="#8fa482" stroke-width="24" stroke-linecap="round"/><circle cx="-15" cy="70" r="12" fill="#e9b98c" stroke="#684a3d" stroke-width="2"/></g><g id="armR" transform="translate(143 158)"><path d="M0 0 Q20 26 8 71" fill="none" stroke="#8fa482" stroke-width="24" stroke-linecap="round"/><circle cx="8" cy="71" r="12" fill="#e9b98c" stroke="#684a3d" stroke-width="2"/></g><g id="head" transform="translate(110 109)"><ellipse rx="54" ry="55" fill="#e8bc90" stroke="#68503f" stroke-width="3"/><circle cx="-52" cy="8" r="11" fill="#e8bc90" stroke="#68503f" stroke-width="2"/><circle cx="52" cy="8" r="11" fill="#e8bc90" stroke="#68503f" stroke-width="2"/><path d="M-30 -3q13-12 27-4M7 -7q13-11 28 2" fill="none" stroke="#48352d" stroke-width="4" stroke-linecap="round"/><circle cx="-18" cy="10" r="4" fill="#3c302a"/><circle cx="21" cy="10" r="4" fill="#3c302a"/><path d="M-6 10q5 11-2 15" fill="none" stroke="#ad8065" stroke-width="3"/><path d="M-31 32Q-12 20 0 32Q14 20 31 32Q14 43 0 37Q-14 43-31 32" fill="#5b504d"/><path id="mouth" d="M-9 43Q0 49 10 43" stroke="#6a4539" stroke-width="3" fill="none"/><path d="M-59 -34Q-44-69 6-66Q49-63 55-34Z" fill="#657f69" stroke="#4f4b3e" stroke-width="3"/><path d="M-62-35Q0-49 64-35Q30-23-5-27Q-42-27-62-35" fill="#809981" stroke="#4f4b3e" stroke-width="2"/></g></g><g id="cup" style="display:none"><path d="M139 212h37l-5 27h-28z" fill="#e7b777" stroke="#75513c" stroke-width="3"/><path d="M176 215q14 0 6 13q-3 4-8 0" fill="none" stroke="#75513c" stroke-width="3"/></g></svg></div><div class="buttons"><button class="active" data-s="idle">Đứng nghỉ</button><button data-s="walk">Đi bộ</button><button data-s="talk">Nói chuyện</button><button data-s="brew">Pha trà</button><button data-s="carry">Bưng món</button><button data-s="serve">Phục vụ</button></div><div class="status" id="status">Trạng thái: Đứng nghỉ</div><div class="row"><button id="pause">Tạm dừng</button><label>Tốc độ <input type="range" id="speed" min=".4" max="2" step=".1" value="1"></label><output id="speedVal">1.0×</output></div><p class="note">Bản thử nghiệm điều khiển khớp 2D theo thời gian thực, dành để kiểm tra nút bấm và chuyển động. Chưa phải sprite mỹ thuật cuối cùng của game.</p></section></div><script>let s='idle',t=0,last=0,paused=false,speed=1;const $=x=>document.getElementById(x),labels={idle:'Đứng nghỉ',walk:'Đi bộ',talk:'Nói chuyện',brew:'Pha trà',carry:'Bưng món',serve:'Phục vụ'},lines={idle:'Chào bác!',walk:'Tôi ra bàn đây!',talk:'Hôm nay đông khách!',brew:'Pha trà nào!',carry:'Có nước rồi đây!',serve:'Mời bác dùng trà!'};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{s=b.dataset.s;t=0;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('active',x===b));$('status').textContent='Trạng thái: '+labels[s];$('say').textContent=lines[s]});$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Phát tiếp':'Tạm dừng'};$('speed').oninput=e=>{speed=+e.target.value;$('speedVal').textContent=speed.toFixed(1)+'×'};function run(ms){if(!last)last=ms;if(!paused)t+=Math.min(.05,(ms-last)/1000)*speed;last=ms;let z=Math.sin(t*8),bob=0,head=0,arms=[0,0],legs=[0,0],x=0;if(s==='idle'){bob=Math.sin(t*2)*2;head=Math.sin(t*1.8)*2;arms=[Math.sin(t*2)*3,-Math.sin(t*2)*3]}if(s==='walk'){bob=Math.abs(z)*6;x=Math.sin(t*3)*9;arms=[-z*32,z*32];legs=[z*28,-z*28];head=-z*3}if(s==='talk'){arms=[-35+Math.sin(t*9)*16,16+Math.cos(t*6)*10];head=Math.sin(t*4)*6}if(s==='brew'){arms=[-40+Math.sin(t*4)*7,-52+Math.cos(t*4)*9];head=Math.sin(t*3)*3}if(s==='carry'){arms=[-45+Math.sin(t*5)*4,-55+Math.sin(t*5)*4];legs=[z*9,-z*9];bob=Math.abs(z)*2}if(s==='serve'){arms=[-50+Math.sin(t*4)*10,-70+Math.cos(t*4)*8];head=5+Math.sin(t*3)*5;bob=Math.sin(t*3)*3}$('body').setAttribute('transform','translate('+x+' '+bob+')');$('head').setAttribute('transform','translate(110 109) rotate('+head+')');$('armL').setAttribute('transform','translate(83 158) rotate('+arms[0]+')');$('armR').setAttribute('transform','translate(143 158) rotate('+arms[1]+')');$('legL').setAttribute('transform','translate(90 218) rotate('+legs[0]+')');$('legR').setAttribute('transform','translate(127 218) rotate('+legs[1]+')');$('cup').style.display=['brew','carry','serve'].includes(s)?'':'none';$('mouth').setAttribute('d',s==='talk'?'M-9 43Q0 '+(47+Math.abs(Math.sin(t*9))*12)+' 10 43':'M-9 43Q0 49 10 43');requestAnimationFrame(run)}requestAnimationFrame(run)</script></body></html>
